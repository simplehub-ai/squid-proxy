# ============================================================
# SIMPLE SQUID PROXY
# Port       : 22222
# Whitelist  : Whitelist IP, Authenticated IP
# ============================================================


# ============================================================
# LISTEN
# ============================================================

http_port 22222


# ============================================================
# ALLOWED CLIENT IPs
# ============================================================

# acl allowed_ip src 1.2.3.4

# http_access allow allowed_ip


# ============================================================
# BASIC AUTHENTICATED
# htpasswd -c /etc/squid/.htpasswd username
# ============================================================

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/.htpasswd
auth_param basic children 3
auth_param basic realm Protected Access
auth_param basic credentialsttl 1 hour

acl allowed_users proxy_auth REQUIRED

http_access allow allowed_users


# ============================================================
# PORT / METHOD ACL
# ============================================================

# Block unsafe destination ports
acl Safe_ports port 80		# http
acl Safe_ports port 21		# ftp
acl Safe_ports port 443		# https
acl Safe_ports port 70		# gopher
acl Safe_ports port 210		# wais
acl Safe_ports port 1025-65535	# unregistered ports
acl Safe_ports port 280		# http-mgmt
acl Safe_ports port 488		# gss-http
acl Safe_ports port 591		# filemaker
acl Safe_ports port 777		# multiling http

http_access deny !Safe_ports

# Only allow CONNECT to HTTPS
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports

# ============================================================
# ACCESS CONTROL
# ============================================================

http_access deny all


# ============================================================
# CLIENT IP PRIVACY
# ============================================================

forwarded_for delete
via off

request_header_access Forwarded deny all
request_header_access X-Forwarded-For deny all
request_header_access X-Forwarded-By deny all
request_header_access X-Forwarded-Host deny all
request_header_access X-Forwarded-Proto deny all
request_header_access Proxy-Connection deny all


# ============================================================
# RESPONSE HEADER PRIVACY
# ============================================================

reply_header_access Via deny all
reply_header_access X-Cache deny all
reply_header_access X-Cache-Lookup deny all


# ============================================================
# CACHE
# ============================================================

# Forward proxy only - no HTTP caching
cache deny all
cache_mem 256 MB


# ============================================================
# CONNECTION / TIMEOUT
# ============================================================

connect_timeout 30 seconds
request_timeout 60 seconds
read_timeout 60 seconds
shutdown_lifetime 5 seconds


# ============================================================
# DNS
# ============================================================

dns_v4_first on
dns_nameservers 1.1.1.1 8.8.8.8

# Connections
max_filedescriptors 65536

# ============================================================
# LOGGING
# ============================================================

#access_log stdio:C:/Squid/var/logs/access.log
#cache_log C:/Squid/var/logs/cache.log
#logfile_rotate 7


# ============================================================
# HOSTNAME
# ============================================================

visible_hostname proxy
